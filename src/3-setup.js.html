  [84, 56, 28].forEach(r => s += `<circle r="${r}" fill="none" stroke="#FF7A1A" stroke-opacity=".28" stroke-width="1.5"/>`);
  s += '<path d="M-84 0 H84 M0 -84 V84" stroke="#FF7A1A" stroke-opacity=".15"/>';
  s += '<g id="mrSweep"><path d="M0 0 L-72.7 -42 A84 84 0 0 1 0 -84 Z" fill="#FF7A1A" fill-opacity=".18"/><line x2="0" y2="-84" stroke="#FF7A1A" stroke-width="2"/></g>';
  for (let i = 0; i < 16; i++) { const a = R() * TAU, r = 14 + R() * 66; s += `<circle cx="${(Math.cos(a) * r).toFixed(1)}" cy="${(Math.sin(a) * r).toFixed(1)}" r="3" fill="#2E5C86" fill-opacity=".75"/>`; }
  s += '<circle id="diveHalo" cx="40" cy="-30" r="10" fill="#FF7A1A" fill-opacity=".25"/><circle id="diveDot" cx="40" cy="-30" r="5" fill="#FF7A1A"/></g>';
  $('#miniRadar').innerHTML = s;
})();

/* ---- parcels ---- */
const PARCELS = [10, 20, 30, 40, 50].map((n, i) => {
  const el = document.createElement('div');
  el.className = 'parcel abs';
  el.innerHTML = `<div class="pbody"></div><div class="flap l"></div><div class="flap r"></div><div class="plabel">Item ${n}</div>`;
  $('#parcels').appendChild(el);
  return { el, i, fl: el.querySelector('.flap.l'), fr: el.querySelector('.flap.r'), lab: el.querySelector('.plabel') };
});

/* ---- chat bars ---- */
$('#hbars').innerHTML = BARS.map(([n, v]) => `<div class="hb"><span class="n">${n}</span><span class="b"><i style="width:${v / BARS[0][1] * 100}%"></i></span><span class="v">0</span></div>`).join('');
const HB = $$('#hbars .hb').map((el, i) => ({ bar: el.querySelector('i'), v: el.querySelector('.v'), n: BARS[i][1] }));

/* ---- end card radar ---- */
(() => {
  let s = '<defs><linearGradient id="endG" gradientUnits="userSpaceOnUse" x1="-460" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#FF7A1A" stop-opacity="0"/><stop offset="1" stop-color="#FF7A1A" stop-opacity=".16"/></linearGradient></defs>';
  s += '<g id="endRings">';
  [120, 220, 320, 420].forEach(r => s += `<circle r="${r}" fill="none" stroke="#E3E9F0" stroke-width="2"/>`);
  s += '<path d="M-470 0 H470 M0 -470 V470" stroke="#EEF2F6" stroke-width="2"/></g>';
  s += '<g id="endSweep"><path d="M0 0 L-398 -230 A460 460 0 0 1 0 -460 Z" fill="url(#endG)"/><line x2="0" y2="-460" stroke="#FF7A1A" stroke-opacity=".35" stroke-width="3"/></g>';
  [[-180, -260], [250, -120], [-300, 140], [160, 280], [330, 230]].forEach(([x, y], i) => s += `<g class="eblip" data-a="${Math.atan2(y, x)}"><circle cx="${x}" cy="${y}" r="20" fill="#FF7A1A" fill-opacity=".15"/><circle cx="${x}" cy="${y}" r="7" fill="#FF7A1A" fill-opacity=".7"/></g>`);
  $('#endRadar').innerHTML = s;
  const words = 'Every shipment. Every item. *On* *your* *radar.*'.split(' ');
  $('#endTag').innerHTML = words.map((w, i) => `<span class="w">${/^\*/.test(w) ? '<em>' + w.slice(1, -1) + '</em>' : w}${i < words.length - 1 ? ' ' : ''}</span>`).join('');
})();
const EBLIPS = $$('.eblip').map(el => ({ el, a: +el.dataset.a }));
const ENDW = $$('#endTag .w');
</script>
