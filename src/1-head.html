<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>cbs RADAR – Every shipment. Every item. On your radar. (30 s)</title>
<style>
:root{
  --o:#FF7A1A; --o2:#FFA54F; --o3:#FFE3C8;
  --navy:#07131F; --navy2:#0D2136; --ink:#12263A; --mute:#5E6E80;
  --line:#E4E9EF; --bgapp:#F3F5F8; --ok:#1E9E6A; --warn:#E39B12; --bad:#D6453B;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;transform-origin:0 0;background:var(--navy)}
.abs{position:absolute}
.layer{position:absolute;left:0;top:0;width:1920px;height:1080px}
#radarBg{background:radial-gradient(1200px 800px at 65% 45%,#11294A 0%,#0A1A2D 45%,#06101C 100%)}
#sky{background:linear-gradient(180deg,#040A14 0%,#0A1A2D 42%,#1F2440 66%,#5A3341 80%,#C2603B 90%,#FF9A4A 100%)}
#sun{left:600px;top:640px;width:900px;height:600px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,190,110,.95),rgba(255,140,60,.55) 30%,rgba(255,110,40,.18) 62%,rgba(255,110,40,0))}
#captions{pointer-events:none}
.cap{position:absolute;left:110px;top:540px;width:600px;transform:translateY(-50%);color:#fff;font-weight:750;font-size:60px;line-height:1.08;letter-spacing:-.02em}
.cap .w{display:inline-block;will-change:transform,opacity;white-space:pre}
.cap .bar{position:absolute;left:-34px;top:8px;width:8px;height:calc(100% - 16px);border-radius:4px;background:var(--o)}
.cap em{font-style:normal;color:var(--o)}
.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:10px;padding:10px 18px 10px 12px;border-radius:999px;background:rgba(12,26,44,.86);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:22px;font-weight:600;white-space:nowrap;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.chip i{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-style:normal;font-size:16px;font-weight:800}
.chip i.q{background:var(--o);color:#fff}
.chip i.doc{background:#fff;color:var(--ink);border-radius:6px}
.chip i.open{background:transparent;border:3px solid var(--warn);width:18px;height:18px;margin:4px}
.chip i.bad{background:var(--bad);color:#fff}
.logo{display:flex;align-items:center;gap:.22em;font-size:120px;line-height:1;white-space:nowrap}
.logo svg{width:1.55em;height:1.55em;overflow:visible;flex:none}
.logo .wm{font-weight:850;letter-spacing:-.03em}
.logo .wm b{font-weight:850;color:#fff}
.logo .wm span{font-weight:700;color:var(--o);letter-spacing:.1em;margin-left:.18em}
.logo.dark .wm b{color:var(--ink)}
#logoBig{left:0;top:0;transform-origin:0 0}
#cam{transform-origin:0 0}
#laptop{left:742px;top:168px;width:1104px;transform-origin:50% 60%}
.lid{position:relative;width:1104px;padding:22px;border-radius:28px 28px 8px 8px;background:linear-gradient(180deg,#1B2633,#0E151E);box-shadow:0 40px 90px rgba(0,0,0,.55),inset 0 0 0 2px #2A3746}
.lid:before{content:"";position:absolute;left:50%;top:9px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#33475C}
.screen{position:relative;width:1060px;height:662px;overflow:hidden;border-radius:6px;background:var(--bgapp);color:var(--ink);font-size:13px}
.base{position:relative;left:-60px;width:1224px;height:26px;border-radius:0 0 26px 26px;background:linear-gradient(180deg,#C9D2DC,#7E8B99);box-shadow:0 20px 40px rgba(0,0,0,.5)}
.base:before{content:"";position:absolute;left:50%;top:0;width:150px;height:9px;margin-left:-75px;border-radius:0 0 10px 10px;background:#9AA6B3}
.scr{position:absolute;inset:0}
.shell{height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#12263A;color:#fff}
.shell .mini{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px}
.shell .mini svg{width:22px;height:22px}
.shell .mini span{color:var(--o);letter-spacing:.08em;font-weight:700}
.shell .sep{width:1px;height:20px;background:rgba(255,255,255,.25)}
.shell .app{font-weight:600;font-size:14px;opacity:.95}
.shell .search{margin-left:auto;width:330px;height:28px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;padding:0 12px;font-size:12px;color:rgba(255,255,255,.65)}
.shell .ic{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.85}
.shell .av{width:28px;height:28px;border-radius:50%;background:var(--o);color:#fff;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.page{padding:16px 20px}
.phdr{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.h1{font-size:22px;font-weight:750;letter-spacing:-.01em}
.sub{font-size:12px;color:var(--mute);margin-top:3px}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:13px;background:#fff;border:1px solid var(--line);font-size:11.5px;color:var(--ink);margin-left:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(18,38,58,.06)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 286px;grid-template-rows:108px 108px 222px;gap:12px}
.tile{padding:13px 15px;position:relative}
.tile .tl{font-size:12px;color:var(--mute);font-weight:600}
.tile .tv{font-size:34px;font-weight:780;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile .td{font-size:11.5px;color:var(--mute);margin-top:2px}
.tile .td.up{color:var(--ok)}
.tile .tv.red{color:var(--bad)}
.tile .tag{position:absolute;right:12px;top:12px;font-size:10px;font-weight:700;color:var(--mute);background:var(--bgapp);border-radius:5px;padding:2px 6px}
.ct{font-size:12.5px;font-weight:700;padding:12px 14px 0}
.ct small{font-weight:500;color:var(--mute);margin-left:6px}
#radarCard{grid-column:4;grid-row:1 / span 2}
#chartCard{grid-column:1 / span 3}
.bars14{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 16px 0}
.bars14 div{flex:1;border-radius:4px 4px 0 0;background:#C9D6E3;transform-origin:bottom}
.bars14 div.hi{background:var(--o)}
.ax{display:flex;justify-content:space-between;padding:6px 16px 0;font-size:10.5px;color:var(--mute)}
.dest{padding:8px 14px}
.dest .r{display:flex;align-items:center;gap:8px;margin:9px 0;font-size:12px}
.dest .r .n{width:96px}
.dest .r .b{flex:1;height:8px;border-radius:4px;background:var(--bgapp);overflow:hidden}
.dest .r .b i{display:block;height:100%;background:#2E5C86;border-radius:4px}
.dest .r .v{width:34px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.crumb{font-size:11.5px;color:var(--mute);margin-bottom:6px}
.crumb b{color:#2464A8;font-weight:600}
.ohdr{display:flex;align-items:center;gap:12px}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:700}
.badge.info{background:#E3EEFA;color:#1F5C9C}
.badge.warn{background:#FFF0DC;color:#B56A00}
.badge.ok{background:#E2F5EC;color:#14794F}
.attrs{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0 10px}
.attrs div{font-size:11px;color:var(--mute)}
.attrs div b{display:block;font-size:13px;color:var(--ink);margin-top:2px;font-weight:650}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--mute)}
.tabs span{padding:8px 0}
.tabs span.on{color:var(--ink);border-bottom:3px solid var(--o)}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tbl th{text-align:left;font-size:11px;color:var(--mute);font-weight:650;padding:9px 12px;background:#F8FAFC;border-bottom:1px solid var(--line)}
.tbl td{padding:0 12px;height:40px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:"SF Mono",Consolas,"Roboto Mono",monospace;font-size:12px}
.du{display:inline-block;padding:2px 7px;border-radius:5px;background:var(--o);color:#fff;font-weight:700;font-size:11px}
#chat{position:absolute;right:0;top:44px;bottom:0;width:440px;background:#fff;box-shadow:-18px 0 40px rgba(18,38,58,.18);display:flex;flex-direction:column}
.chh{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.chh .ai{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--o),#FF4F6A);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.chh b{font-size:14px}
.chh small{display:block;font-size:11px;color:var(--mute);font-weight:500}
.chb{flex:1;padding:14px 16px;position:relative;overflow:hidden}
.msgU{margin-left:auto;max-width:330px;background:#12263A;color:#fff;padding:10px 13px;border-radius:14px 14px 4px 14px;font-size:13px;line-height:1.35}
.msgA{margin-top:12px;max-width:400px;background:var(--bgapp);padding:12px 13px;border-radius:14px 14px 14px 4px;font-size:13px;line-height:1.4}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:11.5px}
.hb .n{width:92px}
.hb .b{flex:1;height:14px}
.hb .b i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#FF8C33,var(--o));transform-origin:left}
.hb .v{width:40px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.evl{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#C05600;border:1.5px solid var(--o);border-radius:8px;padding:4px 9px;background:#fff}
.dots{display:inline-flex;gap:4px;padding:4px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:#9AA7B5}
.chi{margin:12px 16px 16px;height:46px;border:1.5px solid var(--line);border-radius:12px;display:flex;align-items:center;padding:0 12px;font-size:13.5px;gap:8px}
.chi .send{margin-left:auto;width:30px;height:30px;border-radius:8px;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.caret{display:inline-block;width:2px;height:17px;background:var(--o);vertical-align:-3px;margin-left:1px}
#evid{position:absolute;right:452px;top:60px;width:430px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 50px rgba(18,38,58,.25);padding:14px 16px;transform-origin:right center}
#evid h4{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
#evid .kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:11.5px;margin:12px 0}
#evid .kv span{color:var(--mute)}
#evid table{width:100%;border-collapse:collapse;font-size:11.5px}
#evid td,#evid th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
#evid th{color:var(--mute);font-weight:600;font-size:10.5px}
#evid .rec{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--ok);background:#E9F7F0;border-radius:8px;padding:8px 10px}
#check{position:absolute;width:64px;height:64px;border-radius:50%;background:var(--o);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(255,122,26,.5)}
#zoom{background:radial-gradient(900px 700px at 64% 48%,#132C4C 0%,#0A1A2D 55%,#06101C 100%)}
#ctr{left:1070px;top:300px;width:340px;height:360px;perspective:1400px}
.cbox{position:absolute;inset:0;border-radius:6px;background:#1A1F27;box-shadow:inset 0 0 60px rgba(0,0,0,.9),0 30px 70px rgba(0,0,0,.6);border:10px solid #C65A12}
.cbox:after{content:"";position:absolute;inset:0;background:radial-gradient(closest-side,rgba(255,170,90,.18),transparent)}
.door{position:absolute;top:0;width:50%;height:100%;background:repeating-linear-gradient(90deg,#F07A1E 0 14px,#D9661A 14px 18px,#FF8B33 18px 30px);border:6px solid #B3500F}
.door.l{left:0;transform-origin:left center}
.door.r{right:0;transform-origin:right center}
.door:before,.door:after{content:"";position:absolute;top:16px;bottom:16px;width:5px;border-radius:3px;background:#6C3008}
.door.l:before{right:24px}.door.l:after{right:52px}
.door.r:before{left:24px}.door.r:after{left:52px}
.clabel{position:absolute;left:50%;top:-78px;transform:translateX(-50%);white-space:nowrap;color:#fff;text-align:center;font-size:22px;font-weight:700}
.clabel small{display:block;font-size:16px;font-weight:500;color:#AFC0D3;margin-top:4px}
.parcel{position:absolute;left:0;top:0;width:120px;height:104px;margin:-52px 0 0 -60px}
.pbody{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,#D6A266,#B8834A);box-shadow:0 14px 30px rgba(0,0,0,.45)}
.pbody:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:18px;margin-left:-9px;background:rgba(255,236,200,.55)}
.flap{position:absolute;top:0;width:50%;height:30px;background:#C99257;border:1px solid rgba(0,0,0,.12)}
.flap.l{left:0;transform-origin:left top}.flap.r{right:0;transform-origin:right top}
.plabel{position:absolute;left:50%;bottom:-34px;transform:translateX(-50%);color:#fff;font-size:18px;font-weight:700;white-space:nowrap}
#card{left:0;top:0;background:#fff;border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.55);overflow:hidden;color:var(--ink);border:3px solid var(--o)}
#card .in{padding:24px 28px;width:554px}
#card .k{font-size:15px;font-weight:700;color:var(--o);letter-spacing:.06em}
#card .t{font-size:28px;font-weight:780;margin:6px 0 16px;letter-spacing:-.01em}
#card .row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:19px}
#card .row span{color:var(--mute)}
#card .row b{font-weight:750}
#card .row .du{font-size:17px;padding:4px 10px;color:#fff;font-weight:700}
#end{background:#fff}
#endRadar{left:460px;top:-70px;width:1000px;height:1000px}
#endLogo{left:0;top:300px;width:1920px;display:flex;justify-content:center}
#endTag{left:0;top:575px;width:1920px;text-align:center;font-size:58px;font-weight:780;color:var(--ink);letter-spacing:-.02em}
#endTag .w{display:inline-block;white-space:pre}
#endTag em{font-style:normal;color:var(--o)}
#endBadges{left:0;top:700px;width:1920px;display:flex;justify-content:center;gap:18px}
.eb{display:flex;align-items:center;gap:10px;height:52px;padding:0 24px;border-radius:26px;border:2px solid #DCE3EA;font-size:22px;font-weight:650;color:var(--ink);background:#fff}
.eb i{width:12px;height:12px;border-radius:50%;background:#0A6ED1}
#cta{left:0;top:800px;width:1920px;display:flex;justify-content:center}
#cta div{height:70px;padding:0 40px;border-radius:35px;background:var(--o);color:#fff;font-size:28px;font-weight:750;display:flex;align-items:center;gap:14px;box-shadow:0 14px 34px rgba(255,122,26,.4)}
#ui{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(900px,94vw);display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;background:rgba(10,18,28,.85);color:#fff;font-size:13px;transition:opacity .4s;z-index:10}
#ui button{background:rgba(255,255,255,.12);border:0;color:#fff;height:32px;min-width:36px;padding:0 10px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
#ui button.on{background:var(--o)}
#ui input{flex:1;accent-color:#FF7A1A}
#ui .tm{font-variant-numeric:tabular-nums;width:92px;text-align:center;opacity:.85}
body.idle #ui{opacity:0}
body.idle{cursor:none}
body.clean #ui{display:none}
</style>
</head>
